name: Actualizar agenda

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos
  workflow_dispatch:          # botón "Run workflow" para actualizar al instante

permissions:
  contents: write

concurrency:
  group: agenda
  cancel-in-progress: false

jobs:
  agenda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install icalendar recurring-ical-events
      - name: Leer calendario de iCloud
        env:
          AGENDA_ICS: ${{ secrets.AGENDA_ICS }}
        run: python3 agenda/actualizar.py
      - name: Guardar cambios
        run: |
          if [ -n "$(git status --porcelain agenda.json)" ]; then
            git config user.name "agenda-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add agenda.json
            git commit -m "Actualizar agenda"
            git push
          fi
